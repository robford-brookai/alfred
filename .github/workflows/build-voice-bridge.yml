# Build + push the alfred-voice-bridge image (Twilio Media Streams ↔ OpenAI
# Realtime bridge for AgentPhone voice calls).
#
# Dockerfile: packages/voice-bridge/Dockerfile — node:22-slim two-stage build,
# tsc-compiled dist/. The image was previously orphaned; Phase 2 of the
# SMS-via-Hermes + voice-bridge work promotes it to a real compose service.
name: build-voice-bridge

on:
  push:
    branches: [main]
    paths:
      - "packages/voice-bridge/**"
      - ".github/workflows/build-voice-bridge.yml"
  workflow_dispatch:

concurrency:
  group: build-voice-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: packages/voice-bridge
          file: packages/voice-bridge/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ssdavidai00/alfred-voice-bridge:latest
            ssdavidai00/alfred-voice-bridge:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
