name: issue-315-edit
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('packages/mcp-server/src/env.ts'); s=p.read_text(); s=s.replace('  PORT?: string;\n}', '  PORT?: string;\n  NODE_ENV?: string;\n  MCP_TRUST_PROXY_HOPS?: string;\n  MCP_TRUST_PROXY_IPS?: string;\n}').replace('    PORT: process.env.PORT,\n','    PORT: process.env.PORT,\n    NODE_ENV: process.env.NODE_ENV,\n    MCP_TRUST_PROXY_HOPS: process.env.MCP_TRUST_PROXY_HOPS,\n    MCP_TRUST_PROXY_IPS: process.env.MCP_TRUST_PROXY_IPS,\n'); p.write_text(s)
          p=Path('packages/mcp-server/src/index.ts'); s=p.read_text().replace('import { loadEnv } from "./env.js";','import { loadEnv } from "./env.js";\nimport { createProxyTrust } from "./http/proxyTrust.js";').replace('app.set("trust proxy", true); // behind cloudflared','app.set("trust proxy", createProxyTrust(env));'); p.write_text(s)
          p=Path('packages/mcp-server/src/http/proxyTrust.ts'); p.parent.mkdir(parents=True,exist_ok=True); p.write_text('''import proxyaddr from "proxy-addr";\nexport interface ProxyTrustEnv { NODE_ENV?: string; MCP_TRUST_PROXY_HOPS?: string; MCP_TRUST_PROXY_IPS?: string; }\nconst MAX_TRUSTED_HOPS=2;\nfunction parseHops(raw?:string){if(raw==null||raw.trim()==="")return undefined;if(!/^[0-9]+$/.test(raw.trim()))throw new Error("MCP_TRUST_PROXY_HOPS must be a non-negative integer");const n=Number(raw);if(!Number.isSafeInteger(n)||n>MAX_TRUSTED_HOPS)throw new Error(`MCP_TRUST_PROXY_HOPS must be between 0 and ${MAX_TRUSTED_HOPS}`);return n;}\nexport function createProxyTrust(env:ProxyTrustEnv):number|((ip:string,index:number)=>boolean){const hops=parseHops(env.MCP_TRUST_PROXY_HOPS);const cidrs=(env.MCP_TRUST_PROXY_IPS??"").split(",").map(v=>v.trim()).filter(Boolean);if(hops!==undefined&&cidrs.length)throw new Error("Set only one of MCP_TRUST_PROXY_HOPS or MCP_TRUST_PROXY_IPS");if(hops!==undefined)return hops;if(cidrs.length){let t:(ip:string)=>boolean;try{t=proxyaddr.compile(cidrs);}catch{throw new Error("MCP_TRUST_PROXY_IPS contains an invalid CIDR");}return(ip,i)=>i<=MAX_TRUSTED_HOPS&&t(ip);}if(env.NODE_ENV==="production")throw new Error("Production requires MCP_TRUST_PROXY_HOPS or MCP_TRUST_PROXY_IPS; refusing permissive proxy trust");return 0;}\n''')
          Path('packages/mcp-server/src/http/proxyTrust.test.ts').write_text('''import assert from "node:assert/strict"; import test from "node:test"; import {createProxyTrust} from "./proxyTrust.js";\ntest("direct requests trust no proxy",()=>assert.equal(createProxyTrust({NODE_ENV:"test"}),0));\ntest("production fails closed",()=>assert.throws(()=>createProxyTrust({NODE_ENV:"production"}),/requires MCP_TRUST_PROXY/));\ntest("trusted single-hop is bounded",()=>assert.equal(createProxyTrust({NODE_ENV:"production",MCP_TRUST_PROXY_HOPS:"1"}),1));\ntest("spoofed, multi-hop, malformed values reject",()=>{assert.throws(()=>createProxyTrust({NODE_ENV:"production",MCP_TRUST_PROXY_HOPS:"3"}),/between 0 and 2/);assert.throws(()=>createProxyTrust({NODE_ENV:"production",MCP_TRUST_PROXY_HOPS:"x-forwarded-for"}),/non-negative integer/);assert.throws(()=>createProxyTrust({NODE_ENV:"production",MCP_TRUST_PROXY_HOPS:"1",MCP_TRUST_PROXY_IPS:"127.0.0.1/8"}),/only one/)});\ntest("CIDR trust is bounded",()=>{const t=createProxyTrust({NODE_ENV:"production",MCP_TRUST_PROXY_IPS:"10.0.0.0/8"}) as (ip:string,i:number)=>boolean;assert.equal(t("10.1.2.3",0),true);assert.equal(t("192.0.2.1",0),false);assert.equal(t("10.1.2.3",3),false)});\n''')
          p=Path('.env.example'); s=p.read_text(); a='# Express proxy trust: production must declare the bounded ingress topology.\nMCP_TRUST_PROXY_HOPS=1\n# Alternative: comma-separated trusted proxy CIDRs (do not set both).\n# MCP_TRUST_PROXY_IPS=10.0.0.0/8\n\n'; p.write_text(s if 'MCP_TRUST_PROXY_HOPS=' in s else s.replace('# MCP server tool-approval signing secret.',a+'# MCP server tool-approval signing secret.'))
          p=Path('packages/mcp-server/CONTRACT.md'); s=p.read_text(); a='''\n## Reverse-proxy trust and client identity\n\nProduction must set exactly one bounded topology: `MCP_TRUST_PROXY_HOPS` (0–2; the supported single-VM Caddy/cloudflared path is `1`) or `MCP_TRUST_PROXY_IPS` (comma-separated CIDR allowlist). Startup fails when production has neither, both, or malformed/out-of-bound values. The ingress must overwrite or safely append forwarding headers; callers cannot select their rate-limit identity with arbitrary `X-Forwarded-For`.\n'''; p.write_text(s if '## Reverse-proxy trust and client identity' in s else s+a)
          Path('.github/workflows/issue-315-edit.yml').unlink(missing_ok=True)
          PY
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add -A; git commit -m 'fix(mcp): bound production proxy trust and client identity'; git push
